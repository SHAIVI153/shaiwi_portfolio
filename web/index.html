<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project.">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="shaiwi_portfolio">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>shaiwi_portfolio</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
<!-- ── In-app browser notice ─────────────────────────────────────────────
     Instagram / Facebook / TikTok's built-in browser is a stripped-down
     WebView that often can't run Flutter's CanvasKit renderer (it needs
     WebGL + a ~1.5MB wasm download), which is why the site can go blank
     there while it works fine in Chrome/Safari. This banner is plain
     HTML/CSS shown immediately — before Flutter even starts loading — so
     visitors always see something and get a one-tap way out. -->
<div id="iab-banner" style="display:none;position:fixed;top:0;left:0;right:0;
      z-index:99999;background:#0D1520;color:#EEF2FF;font-family:-apple-system,
      BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:12px 16px;
      align-items:center;justify-content:space-between;gap:12px;
      border-bottom:1px solid #1A2D45;box-shadow:0 4px 20px rgba(0,0,0,.4);">
    <span style="font-size:13px;line-height:1.4;">
      This preview browser can't render this site properly.<br>
      Tap below to open it in your regular browser.
    </span>
    <button id="iab-open-btn" style="flex-shrink:0;background:linear-gradient(90deg,#00D4FF,#7B2FFF);
        color:#050A0F;border:none;border-radius:8px;padding:10px 16px;
        font-weight:700;font-size:12px;white-space:nowrap;cursor:pointer;">
        Open in Browser
    </button>
</div>
<script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isInApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|MicroMessenger|TikTok|musical_ly/i.test(ua);
      if (!isInApp) return;

      var banner = document.getElementById('iab-banner');
      banner.style.display = 'flex';

      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);

      document.getElementById('iab-open-btn').addEventListener('click', function () {
        var url = window.location.href;
        if (isAndroid) {
          // Force-opens Chrome via an Android intent link
          var withoutScheme = url.replace(/^https?:\/\//, '');
          window.location = 'intent://' + withoutScheme +
              '#Intent;scheme=https;package=com.android.chrome;end';
        } else if (isIOS) {
          // iOS in-app browsers block programmatic hand-off — guide the user
          alert('Tap the ••• (or share) icon at the bottom of the screen, then choose "Open in Safari" / "Open in Browser".');
        } else {
          window.open(url, '_blank');
        }
      });
    })();
</script>

<!--
  You can customize the "flutter_bootstrap.js" script.
  This is useful to provide a custom configuration to the Flutter loader
  or to give the user feedback during the initialization process.

  For more details:
  * https://docs.flutter.dev/platform-integration/web/initialization
-->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
